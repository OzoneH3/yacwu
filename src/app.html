<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#faf8f1" />
		<script>
			(function () {
				const saved = localStorage.getItem('yacwu-theme');
				const theme = saved === 'light' || saved === 'dark'
					? saved
					: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
				document.querySelector('meta[name="theme-color"]')?.setAttribute(
					'content', theme === 'dark' ? '#25221f' : '#faf8f1'
				);
			})();
		</script>
		<meta name="description" content="A focused web workspace for Codex sessions." />
		<title>yacwu — Codex workspace</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
