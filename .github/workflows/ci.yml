name: CI

on:
  push:
    branches: [main, windows-codex]
  pull_request:

jobs:
  frontend:
    name: Frontend (svelte-check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build

  backend:
    name: Backend (gleam format, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build --warnings-as-errors
      - run: gleam test

  integrations:
    name: Browser and adapter integrations (isolated, no model credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YACWU_PERSISTENT_BACKENDS: '0'
      YACWU_BACKENDS: ''
      YACWU_RESET_FEED: 'off'
      CODEX_HOME: ${{ github.workspace }}/.workspace/ci-codex
      XDG_STATE_HOME: ${{ github.workspace }}/.workspace/ci-state
      YACWU_USAGE_DIR: ${{ github.workspace }}/.workspace/ci-usage
      TMPDIR: ${{ github.workspace }}/.workspace/tmp
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR" "$CODEX_HOME" "$XDG_STATE_HOME" "$YACWU_USAGE_DIR"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.18.1'
          rebar3-version: '3'
      - uses: actions/checkout@v5
        with:
          repository: fuergaosi233/claude-codex
          ref: 99f4162408292ef1760472f5927b07ea06a1624a
          path: claude-codex
      - run: bun install
      - run: npm install --prefix .workspace/cli @openai/codex@0.160.0
      - run: echo "$GITHUB_WORKSPACE/.workspace/cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun install && bun run build
        working-directory: claude-codex
      - run: test -f claude-codex/dist/src/adapter.mjs && codex --version
      - run: gleam deps download && gleam build
        working-directory: server
      - run: bun run test:adapter
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-failures
          path: test-results/

  windows:
    name: Windows native Codex (build, paths, stdio, policies, relay)
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      YACWU_PORTABLE_TESTS: '1'
      YACWU_BACKEND_ROOT: ${{ github.workspace }}
      YACWU_BACKENDS: ''
      YACWU_PERSISTENT_BACKENDS: '0'
      YACWU_RESET_FEED: 'off'
      CODEX_HOME: ${{ github.workspace }}/.workspace/ci-codex
      XDG_STATE_HOME: ${{ github.workspace }}/.workspace/ci-state
      TMPDIR: ${{ github.workspace }}/.workspace/tmp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.18.1'
          rebar3-version: '3'
      - name: Prepare isolated directories
        run: New-Item -ItemType Directory -Force $env:TMPDIR, $env:CODEX_HOME, $env:XDG_STATE_HOME
      - run: bun install
      - run: bun run check
      - run: bun run build
      - run: bun test tests/unit/host-path.test.ts tests/unit/shared-channel.test.ts tests/unit/markdown.test.ts tests/unit/file-change-stats.test.ts
      - run: node --test tests/adapter/windows-runtime.test.mjs
      - run: gleam build --warnings-as-errors
        working-directory: server
      - run: gleam test
        working-directory: server
      - name: Parse PowerShell scripts
        run: |
          foreach ($file in @('start.ps1', 'install-windows.ps1', 'scripts/protect-path.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Check missing-prerequisite installer preview
        run: .\tests\windows-installer-preview.ps1
      - name: Preview prerequisite installer
        run: .\install-windows.ps1 -WhatIf
      - run: npm install --prefix .workspace/cli @openai/codex@0.160.0
      - name: Native Codex protocol smoke test (no model credentials)
        run: |
          $env:YACWU_CODEX_BIN = Join-Path $pwd '.workspace/cli/node_modules/.bin/codex.cmd'
          node scripts/smoke-codex.mjs
      - run: bunx playwright install chromium
      - run: bunx playwright test tests/windows-paths.spec.ts tests/directory-links.spec.ts
